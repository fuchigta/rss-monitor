[global]
# Ofelia configuration for RSS Monitor

# Job: Collect RSS feeds every 30 minutes
[job-exec "collect-feeds"]
schedule = @every 30m
container = rss-monitor-app
command = python main.py collect

# Job: Update Hatena bookmark counts every hour
[job-exec "update-bookmarks"]
schedule = @every 1h
container = rss-monitor-app
command = python main.py update-bookmarks

# Job: Evaluate metrics every 15 minutes
[job-exec "evaluate-metrics"]
schedule = @every 15m
container = rss-monitor-app
command = python main.py evaluate-metrics

# Job: Full cycle (collect + bookmarks + metrics) every 6 hours
[job-exec "full-cycle"]
schedule = @every 6h
container = rss-monitor-app
command = python main.py run-all
