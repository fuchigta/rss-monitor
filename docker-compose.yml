version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rss-monitor-db
    environment:
      POSTGRES_DB: rss_monitor
      POSTGRES_USER: rss_user
      POSTGRES_PASSWORD: rss_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rss_user -d rss_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rss-monitor-network

  grafana:
    image: grafana/grafana:latest
    container_name: rss-monitor-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rss-monitor-network

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: rss-monitor-app
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: rss_monitor
      DB_USER: rss_user
      DB_PASSWORD: rss_password
    volumes:
      - ./app:/app
      - ./config:/config
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rss-monitor-network
    command: tail -f /dev/null  # Keep container running for Ofelia

  scheduler:
    image: mcuadros/ofelia:latest
    container_name: rss-monitor-scheduler
    depends_on:
      - app
      - postgres
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ofelia/config.ini:/etc/ofelia/config.ini
    networks:
      - rss-monitor-network
    labels:
      ofelia.enabled: "true"

volumes:
  postgres_data:
  grafana_data:

networks:
  rss-monitor-network:
    driver: bridge
